name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Fournit la commande `gradle` sur le runner (le dépôt n'a pas de
      # gradle-wrapper.jar : un binaire impossible à produire sans Android SDK).
      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      # OBLIGATOIRE : le dépôt ne contient pas gradle-wrapper.jar (binaire
      # impossible à produire hors d'un environnement Android). `gradle wrapper`
      # génère gradlew, gradlew.bat et le jar avant tout appel à ./gradlew.
      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      # Garde-fou : fait échouer le build si un test unitaire régresse.
      - name: Lancer les tests unitaires
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compiler l'APK release
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
